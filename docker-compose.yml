version: '3.8'

services:
  # PHP Uygulaması (Senin yazdığın Dockerfile'ı kullanır)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - api_network
    depends_on:
      - db
      - redis

  # Nginx Web Sunucusu (Gelen REST API isteklerini PHP'ye iletir)
  webserver:
    image: nginx:alpine
    container_name: api_webserver
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./nginx/conf.d:/etc/nginx/conf.d
    networks:
      - api_network

  # MySQL Veritabanı
  db:
    image: mysql:8.0
    container_name: api_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: assessment_api
      MYSQL_ROOT_PASSWORD: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - api_network

  # Redis (Cache ve Queue için)
  redis:
    image: redis:alpine
    container_name: api_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - api_network

# Veritabanı verilerinin silinmemesi için kalıcı disk alanı
volumes:
  dbdata:

networks:
  api_network:
    driver: bridge